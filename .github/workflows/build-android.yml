name: "Build Android APK"

on:
  push:
    branches:
      - "fix/**"
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm install

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Configure Android NDK toolchain
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          BIN="$TOOLCHAIN/bin"

          echo "$BIN" >> $GITHUB_PATH

          for target in aarch64-linux-android armv7a-linux-androideabi; do
            ln -sf "$BIN/llvm-ranlib" "$BIN/${target}-ranlib"
            ln -sf "$BIN/llvm-ar" "$BIN/${target}-ar"
            ln -sf "$BIN/llvm-strip" "$BIN/${target}-strip"
          done

          echo "CC_aarch64_linux_android=${BIN}/aarch64-linux-android21-clang" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=${BIN}/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB_aarch64_linux_android=${BIN}/llvm-ranlib" >> $GITHUB_ENV

          echo "CC_armv7_linux_androideabi=${BIN}/armv7a-linux-androideabi21-clang" >> $GITHUB_ENV
          echo "AR_armv7_linux_androideabi=${BIN}/llvm-ar" >> $GITHUB_ENV
          echo "RANLIB_armv7_linux_androideabi=${BIN}/llvm-ranlib" >> $GITHUB_ENV

          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << EOF
          [target.aarch64-linux-android]
          linker = "${BIN}/aarch64-linux-android21-clang"

          [target.armv7-linux-androideabi]
          linker = "${BIN}/armv7a-linux-androideabi21-clang"
          EOF

      - name: Build Android APK
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          VITE_TV_MODE: "true"
        run: npm run tauri android build -- --apk --target aarch64 --target armv7

      - name: Sign APK
        run: |
          # 1. Generate release keystore
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias vega-key \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Vega, OU=VegaTV, O=Vega, L=Unknown, ST=Unknown, C=US"

          # 2. Get the largest unsigned APK path
          UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*-unsigned.apk" | xargs ls -S | head -n 1)
          echo "Found unsigned APK: $UNSIGNED_APK"

          # 3. Locate the latest Android Build Tools on the GitHub Runner
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          echo "Using Android build tools from: $BUILD_TOOLS"

          # 4. Zipalign it
          $BUILD_TOOLS/zipalign -v -p 4 "$UNSIGNED_APK" app-aligned.apk

          # 5. Sign it with v1, v2, and v3 scheme
          $BUILD_TOOLS/apksigner sign \
            --ks release.jks \
            --ks-key-alias "vega-key" \
            --ks-pass pass:"android" \
            --key-pass pass:"android" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out vega-tv-android.apk \
            app-aligned.apk

          # 6. Verify signature
          $BUILD_TOOLS/apksigner verify --verbose vega-tv-android.apk

      - name: Upload signed APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: vega-tv-android-signed
          path: vega-tv-android.apk
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete bravia-tv-fix --yes --cleanup-tag 2>/dev/null || true
          gh release create bravia-tv-fix vega-tv-android.apk \
            --title "Vega Android TV (Bravia Fix)" \
            --notes "Vega TV build with fixes for Sony Bravia remote freeze and screensaver during playback. Pre-aligned and signed APK ready to install on Android TV."

